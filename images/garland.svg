<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="70" viewBox="0 0 800 70" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .gl { animation: gl 3s ease-in-out infinite; }
      .gs { animation: gs 3s ease-in-out infinite; }
      @keyframes gl { 0%, 100% { opacity: .22; } 50% { opacity: .9; } }
      @keyframes gs { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
      .d1 { animation-delay: 0s; }
      .d2 { animation-delay: -.6s; }
      .d3 { animation-delay: -1.2s; }
      .d4 { animation-delay: -1.8s; }
      .d5 { animation-delay: -2.4s; }
    </style>

    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.65">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.38"/>
    </linearGradient>

    <linearGradient id="socket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1a10"/>
      <stop offset="0.45" stop-color="#34523e"/>
      <stop offset="1" stop-color="#0b1a10"/>
    </linearGradient>

    <linearGradient id="clip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b717b"/>
      <stop offset="0.5" stop-color="#c4c9d1"/>
      <stop offset="1" stop-color="#6b717b"/>
    </linearGradient>

    <!-- Ореол світла -->
    <g id="glow">
      <circle cx="0" cy="17" r="13" fill="currentColor" filter="url(#blur)"/>
    </g>

    <!-- Патрон -->
    <g id="socket-body">
      <rect x="-1.5" y="-2" width="3" height="3" fill="#0b1a10"/>
      <rect x="-3.4" y="0" width="6.8" height="8" rx="1.3" fill="url(#socket)"/>
      <line x1="-3.4" y1="2.6" x2="3.4" y2="2.6" stroke="#000" stroke-opacity="0.55" stroke-width="0.7"/>
      <line x1="-3.4" y1="4.8" x2="3.4" y2="4.8" stroke="#000" stroke-opacity="0.55" stroke-width="0.7"/>
      <line x1="-3.4" y1="3.2" x2="3.4" y2="3.2" stroke="#fff" stroke-opacity="0.12" stroke-width="0.5"/>
      <line x1="-3.4" y1="5.4" x2="3.4" y2="5.4" stroke="#fff" stroke-opacity="0.12" stroke-width="0.5"/>
    </g>

    <!-- Скляна лампочка -->
    <g id="glass">
      <path d="M-4.2,7 C-8.6,12.5 -7.3,21.5 0,25 C7.3,21.5 8.6,12.5 4.2,7 Z" fill="currentColor"/>
      <path d="M-4.2,7 C-8.6,12.5 -7.3,21.5 0,25 C7.3,21.5 8.6,12.5 4.2,7 Z" fill="url(#shade)"/>
      <path d="M-4.2,7 C-8.6,12.5 -7.3,21.5 0,25 C7.3,21.5 8.6,12.5 4.2,7 Z" fill="url(#shine)"/>
      <ellipse cx="-2.7" cy="13" rx="1.2" ry="3" fill="#fff" fill-opacity="0.7" transform="rotate(10 -2.7 13)"/>
      <circle cx="2.8" cy="19.5" r="0.8" fill="#fff" fill-opacity="0.35"/>
    </g>
  </defs>

  <!-- Дріт: тінь/основа + блік -->
  <path d="M0,4 Q200,44 400,4 Q600,44 800,4" fill="none" stroke="#0b1d12" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M0,3.3 Q200,43.3 400,3.3 Q600,43.3 800,3.3" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="0.7"/>

  <!-- Кріплення (на стиках і по краях) -->
  <g>
    <rect x="-2" y="0" width="4" height="6" rx="1" fill="url(#clip)"/>
    <rect x="398" y="0" width="4" height="6" rx="1" fill="url(#clip)"/>
    <rect x="798" y="0" width="4" height="6" rx="1" fill="url(#clip)"/>
    <circle cx="0" cy="2" r="0.7" fill="#4a4f57"/>
    <circle cx="400" cy="2" r="0.7" fill="#4a4f57"/>
    <circle cx="800" cy="2" r="0.7" fill="#4a4f57"/>
  </g>

  <!-- ПЕРША ГІРЛЯНДА (0–400) -->
  <g transform="translate(40 11.2) rotate(9)" style="color:#ff3b3b">
    <use href="#glow" xlink:href="#glow" class="gl d1"/><use href="#socket-body" xlink:href="#socket-body"/><use href="#glass" xlink:href="#glass" class="gs d1"/>
  </g>
  <g transform="translate(120 20.8) rotate(4.6)" style="color:#ffc933">
    <use href="#glow" xlink:href="#glow" class="gl d2"/><use href="#socket-body" xlink:href="#socket-body"/><use href="#glass" xlink:href="#glass" class="gs d2"/>
  </g>
  <g transform="translate(200 24)" style="color:#35d36b">
    <use href="#glow" xlink:href="#glow" class="gl d3"/><use href="#socket-body" xlink:href="#socket-body"/><use href="#glass" xlink:href="#glass" class="gs d3"/>
  </g>
  <g transform="translate(280 20.8) rotate(-4.6)" style="color:#3b9cff">
    <use href="#glow" xlink:href="#glow" class="gl d4"/><use href="#socket-body" xlink:href="#socket-body"/><use href="#glass" xlink:href="#glass" class="gs d4"/>
  </g>
  <g transform="translate(360 11.2) rotate(-9)" style="color:#e040fb">
    <use href="#glow" xlink:href="#glow" class="gl d5"/><use href="#socket-body" xlink:href="#socket-body"/><use href="#glass" xlink:href="#glass" class="gs d5"/>
  </g>

  <!-- ДРУГА ГІРЛЯНДА (400–800), інший порядок кольорів -->
  <g transform="translate(440 11.2) rotate(9)" style="color:#ffc933">
    <use href="#glow" xlink:href="#glow" class="gl d3"/><use href="#socket-body" xlink:href="#socket-body"/><use href="#glass" xlink:href="#glass" class="gs d3"/>
  </g>
  <g transform="translate(520 20.8) rotate(4.6)" style="color:#3b9cff">
    <use href="#glow" xlink:href="#glow" class="gl d5"/><use href="#socket-body" xlink:href="#socket-body"/><use href="#glass" xlink:href="#glass" class="gs d5"/>
  </g>
  <g transform="translate(600 24)" style="color:#ff3b3b">
    <use href="#glow" xlink:href="#glow" class="gl d1"/><use href="#socket-body" xlink:href="#socket-body"/><use href="#glass" xlink:href="#glass" class="gs d1"/>
  </g>
  <g transform="translate(680 20.8) rotate(-4.6)" style="color:#e040fb">
    <use href="#glow" xlink:href="#glow" class="gl d2"/><use href="#socket-body" xlink:href="#socket-body"/><use href="#glass" xlink:href="#glass" class="gs d2"/>
  </g>
  <g transform="translate(760 11.2) rotate(-9)" style="color:#35d36b">
    <use href="#glow" xlink:href="#glow" class="gl d4"/><use href="#socket-body" xlink:href="#socket-body"/><use href="#glass" xlink:href="#glass" class="gs d4"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
